[project]
name = "qc-framework"
version = "0.1.0"
description = "Spike-sorting QC modeling framework"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
modeling = ["lightgbm", "shap", "catboost"]
neural = ["torch"]
notebook = ["nbformat", "seaborn", "matplotlib", "pyarrow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
